[project]
name = "prompt-editor"
version = "0.1.0"
description = "A ComfyUI custom node for writing and inspecting prompts, with MANUAL/LLM status and last-input history."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/DaemonSK/ComfyUI-PromptEditor"

[tool.comfy]
PublisherId = "bonfire"
DisplayName = "Prompt Editor"
requires-comfyui = ">=0.34.0"
